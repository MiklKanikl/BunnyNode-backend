<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>BunnyNode Documentation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .back-button {
      background: #0a1c2f !important;
      color: white !important;
      text-decoration: none !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
      padding: 0.5rem 1rem !important;
      border-radius: 9999px !important;
      transition: all 0.2s ease !important;
      border: none !important;
      cursor: pointer !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1) !important;
      position: absolute !important;
      top: 1rem !important;
      left: 1rem !important;
    }

    .back-button:hover {
      background: #123d5e !important;
      transform: scale(1.05) !important;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.2) !important;
    }

    .doc-card {
      max-width: 1280px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(0px);
      background: #ffffff;
      border-radius: 3rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .doc-header {
      background: #0a1c2f;
      padding: 2.5rem 2rem 2rem 2rem;
      text-align: center;
      color: white;
    }

    .doc-header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .doc-header .tagline {
      font-size: 1.05rem;
      opacity: 0.85;
      font-weight: 500;
      max-width: 500px;
      margin: 0 auto;
    }
    </style>
</head>
<body>
  <a href="/" class="back-button">← Back to Start</a>
  
  <div class="doc-card">
    <div class="doc-header">
      <h1>BunnyNode Documentation</h1>
      <div class="tagline">Comprehensive guides and API references for BunnyNode</div>
    </div>
    <div class="doc-content">
        <!-- Documentation content goes here -->
    </div>
  </div>
</body>
</html>
