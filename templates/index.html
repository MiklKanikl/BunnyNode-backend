<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>BunnyNode - Home</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100;14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -5%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(30px); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(59, 130, 246, 0.1);
      padding: 4rem 3rem;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
    }

    .container h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #e0e7ff 0%, #a5f3fc 50%, #86efac 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .container p {
      font-size: 1.15rem;
      color: rgba(226, 232, 240, 0.9);
      font-weight: 400;
      margin-bottom: 3rem;
      line-height: 1.6;
      letter-spacing: 0.3px;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 1.25rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .links a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: inherit;
      filter: brightness(1.2);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .links a:first-child {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: 1px solid rgba(59, 130, 246, 0.5);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.2);
    }

    .links a:first-child:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 40px rgba(59, 130, 246, 0.4);
      border-color: rgba(59, 130, 246, 0.8);
    }

    .links a:last-child {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
      color: #a5f3fc;
      border: 1.5px solid rgba(165, 243, 252, 0.3);
    }

    .links a:last-child:hover {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(139, 92, 246, 0.25) 100%);
      color: #ffffff;
      border-color: rgba(165, 243, 252, 0.6);
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.2);
    }

    @media (max-width: 640px) {
      .container {
        padding: 2.5rem 1.5rem;
      }

      .container h1 {
        font-size: 2.25rem;
      }

      .container p {
        font-size: 1rem;
      }

      .links {
        flex-direction: column;
      }

      .links a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BunnyNode</h1>
    <p>Your all-in-one solution for seamless graph management and data visualisation.</p>
    <div class="links">
      <a href="/downloads">Download</a>
      <a href="/docs">Documentation</a>
    </div>
  </div>
</body>
</html>
